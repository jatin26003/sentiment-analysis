<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Sentiment Analyzer</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: linear-gradient(135deg, #1f2933, #111827);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e5e7eb;
        }

        .card {
            background: #1f2933;
            width: 700px;
            max-width: 90%;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #9ca3af;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 140px;
            border-radius: 12px;
            border: none;
            padding: 15px;
            font-size: 16px;
            outline: none;
            resize: none;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 14px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            background: linear-gradient(to right, #6366f1, #8b5cf6);
            color: white;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99,102,241,0.4);
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            background: #111827;
        }

        .sentiment {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
        }

        .confidence {
            text-align: center;
            margin-top: 8px;
            color: #9ca3af;
        }

        .bar-container {
            margin-top: 15px;
        }

        .label {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .bar-bg {
            width: 100%;
            background: #374151;
            border-radius: 8px;
            overflow: hidden;
        }

        .bar {
            height: 16px;
            border-radius: 8px;
        }

        .positive {
            background: linear-gradient(to right, #22c55e, #4ade80);
        }

        .negative {
            background: linear-gradient(to right, #ef4444, #f87171);
        }

        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #6b7280;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>🎬 IMDB Sentiment Analyzer</h1>
    <div class="subtitle">
        Analyze movie reviews with confidence scores
    </div>

    <form action="/predict" method="post">
        <textarea name="review" placeholder="Type or paste a movie review here...">{{ review }}</textarea>
        <button type="submit">Analyze Sentiment</button>
    </form>

    {% if sentiment %}
    <div class="result">
        <div class="sentiment">{{ sentiment }}</div>
        <div class="confidence">Confidence: {{ confidence }}%</div>

        <div class="bar-container">
            <div class="label">Positive – {{ positive }}%</div>
            <div class="bar-bg">
                <div class="bar positive" style="width: {{ positive }}%;"></div>
            </div>
        </div>

        <div class="bar-container">
            <div class="label">Negative – {{ negative }}%</div>
            <div class="bar-bg">
                <div class="bar negative" style="width: {{ negative }}%;"></div>
            </div>
        </div>
    </div>
    {% endif %}

    <footer>
        Made  by Jatin Nayak
    </footer>
</div>

</body>
</html>
